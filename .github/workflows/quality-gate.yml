name: NC Decision quality gate

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ai-expert-damu-v1]
    paths:
      - 'src/**'
      - 'scripts/random_funding_smoke.ts'
      - 'scripts/ai_expert_contract_smoke.ts'
      - 'package.json'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

jobs:
  typecheck-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - name: TypeScript check
        run: npm run lint
      - name: Randomized funding routing smoke tests
        run: npm run test:smoke
      - name: AI Expert contract smoke tests
        run: npm run test:ai-expert
